<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sysman Analytics - Almoxarifado Multimídia</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f6f9; color: #333; width: 100%; min-height: 100vh; }
        header { background: #17324d; color: #fff; padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        header h1 { margin: 0; font-size: 1.6rem; }
        header p { margin: 4px 0 0; opacity: 0.8; font-size: 0.95rem; }
        .btn-header { background: #007bff; color: white; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; border: none; cursor: pointer; }
        .btn-header:hover { background: #0056b3; }
        
        .container { padding: 20px 30px; width: 100%; max-width: 100%; margin: 0; }
        .kpis { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px; width: 100%; }
        .card { background: #fff; padding: 22px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); flex: 1; min-width: 220px; }
        .card h2 { margin: 0; font-size: 2.2rem; color: #17324d; }
        .card p { margin: 6px 0 0; color: #6c757d; font-weight: bold; font-size: 0.95rem; }
        
        .section { background: #fff; margin-top: 20px; padding: 22px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); width: 100%; }
        input, select { padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { border: 1px solid #e2e8f0; padding: 10px 12px; font-size: 13px; text-align: left; }
        th { background: #f8f9fa; position: sticky; top: 0; font-weight: bold; color: #17324d; }
        tr:nth-child(even) { background-color: #fcfcfc; }
        tr:hover { background-color: #f1f5f9; }
        
        .table-wrap { max-height: 650px; overflow: auto; margin-top: 12px; border: 1px solid #e2e8f0; border-radius: 6px; }
        .chart-container { position: relative; height: 480px; width: 100%; }
        #statusConexao { padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>📊 Sysman Analytics</h1>
        <p>Almoxarifado Multimídia - Santuário Nacional</p>
    </div>
    <div>
        <a href="index.html" class="btn-header">⬅ Voltar ao Estoque</a>
    </div>
</header>

<div class="container">
    
    <div id="statusConexao"></div>

    <div class="section" style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 220px;">
            <label style="display: block; font-weight: bold; margin-bottom: 6px; color: #17324d;">🏢 Filtrar por Setor / Local:</label>
            <select id="filtroSetor" style="width: 100%;" onchange="aplicarFiltros()">
                <option value="">Todos os Setores</option>
            </select>
        </div>

        <div style="flex: 1; min-width: 220px;">
            <label style="display: block; font-weight: bold; margin-bottom: 6px; color: #17324d;">📁 Filtrar por Projeto:</label>
            <select id="filtroProjeto" style="width: 100%;" onchange="aplicarFiltros()">
                <option value="">Todos os Projetos</option>
            </select>
        </div>

        <div style="flex: 2; min-width: 280px;">
            <label style="display: block; font-weight: bold; margin-bottom: 6px; color: #17324d;">🔍 Pesquisa Geral:</label>
            <input type="text" id="search" placeholder="Pesquisar patrimônio, modelo, marca, série..." style="width: 100%;" onkeyup="aplicarFiltros()">
        </div>
    </div>

    <div class="kpis">
        <div class="card"><h2 id="total">0</h2><p>Total de Equipamentos</p></div>
        <div class="card"><h2 id="setores">0</h2><p>Setores Mapeados</p></div>
        <div class="card"><h2 id="projetos">0</h2><p>Projetos Ativos</p></div>
    </div>

    <div class="section">
        <h3 style="margin-top: 0; color: #17324d;">Equipamentos por Setor / Local</h3>
        <div class="chart-container">
            <canvas id="grafico"></canvas>
        </div>
    </div>

    <div class="section">
        <h3 style="margin-top: 0; color: #17324d;">Tabela Completa de Equipamentos (Nuvem)</h3>
        <div class="table-wrap">
            <table id="tbl">
                <tr><td style="padding: 20px; text-align: center;">⌛ Carregando dados do Supabase...</td></tr>
            </table>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://tocmqlsicxuxfkiptgaj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvY21xbHNpY3h1eGZraXB0Z2FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNTIyODEsImV4cCI6MjA5OTYyODI4MX0.B-UKh4qMQG02guuJhIlI-ZB0d4OjlByFyfOoGISiqMY"; 

let _supabase;
let dadosCruzadosCompletos = [];
let chart = null;

function exibirStatus(mensagem, tipo) {
    const box = document.getElementById('statusConexao');
    box.style.display = 'block';
    box.innerText = mensagem;
    if (tipo === 'erro') {
        box.style.background = '#f8d7da';
        box.style.color = '#721c24';
    } else {
        box.style.background = '#d4edda';
        box.style.color = '#155724';
    }
}

async function inicializarEBuscarDados() {
    try {
        if (typeof supabase === 'undefined') {
            exibirStatus("❌ A biblioteca do Supabase não foi carregada. Verifique sua conexão com a internet.", "erro");
            return;
        }

        _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Busca tabela de locais
        const { data: locais, error: errLoc } = await _supabase.from('locais').select('*');
        if (errLoc) {
            exibirStatus("❌ Erro ao consultar tabela 'locais': " + errLoc.message, "erro");
            return;
        }

        // Busca tabela de equipamentos
        const { data: equipamentos, error: errEq } = await _supabase.from('equipamentos').select('*');
        if (errEq) {
            exibirStatus("❌ Erro ao consultar tabela 'equipamentos': " + errEq.message, "erro");
            return;
        }

        if (!equipamentos || equipamentos.length === 0) {
            exibirStatus("⚠️ O banco respondeu com sucesso, mas a tabela 'equipamentos' está vazia.", "erro");
            document.getElementById('tbl').innerHTML = "<tr><td style='padding:20px; text-align:center;'>Nenhum registro encontrado na tabela de equipamentos do Supabase.</td></tr>";
            return;
        }

        // Mapeamento de locais para junção
        let mapaLocais = {};
        (locais || []).forEach(loc => {
            let codLimpo = String(loc.codigo || '').replace(/^0+/, '').trim();
            if (codLimpo) {
                mapaLocais[codLimpo] = {
                    nome: loc.nome_local || 'Sem Nome Mapeado',
                    projeto: loc.projeto || 'Sem Projeto'
                };
            }
        });

       // Formatação dos dados (com equivalência para Estoque 183 / Almoxarifado Multimídia)
        dadosCruzadosCompletos = equipamentos.map(eq => {
            let codRaw = String(eq.codigo_local || '').trim();
            let codEqLimpo = codRaw.replace(/^0+/, '');

            // Equivalência: Se for '183', '0183' ou '01.03.21.007', vincula ao Almoxarifado Multimídia
            if (codRaw === '183' || codRaw === '0183' || codRaw === '01.03.21.007') {
                codEqLimpo = '1.03.21.007'; // Chave correspondente na tabela de locais
            }

            let infoLoc = mapaLocais[codEqLimpo];

            let nomeSetor = infoLoc ? infoLoc.nome : (codRaw === '183' ? 'Almoxarifado Multimídia' : 'Sem Nome Mapeado');
            let nomeProjeto = infoLoc ? infoLoc.projeto : 'Sem Projeto';

            return {
                'Patrimônio': eq.patrimonio || '',
                'Classe': eq.classe || '',
                'Modelo': eq.modelo || '',
                'Fabricante': eq.fabricante || '',
                'Cód. Local': eq.codigo_local || '',
                'Prioridade': eq.prioridade || '',
                'Nº Série': eq.num_serie || '',
                'Referência': eq.referencia || '',
                'Status': eq.status || 'Em Almoxarifado',
                'Setor/Local': eq.codigo_local ? `${eq.codigo_local} / ${nomeSetor}` : 'Sem Local',
                'Projeto': nomeProjeto
            };
        });

        exibirStatus(`✅ Dados carregados diretamente do Supabase! Total: ${dadosCruzadosCompletos.length} equipamentos.`, "sucesso");

        preencherFiltrosSelects();
        aplicarFiltros();

    } catch (err) {
        console.error("Exceção:", err);
        exibirStatus("❌ Erro inesperado no JavaScript: " + err.message, "erro");
    }
}

function preencherFiltrosSelects() {
    const selectSetor = document.getElementById('filtroSetor');
    const selectProjeto = document.getElementById('filtroProjeto');

    const setoresPresentes = [...new Set(dadosCruzadosCompletos.map(d => d['Setor/Local']))].filter(Boolean).sort();
    const projetosPresentes = [...new Set(dadosCruzadosCompletos.map(d => d['Projeto']))].filter(Boolean).sort();

    selectSetor.innerHTML = '<option value="">Todos os Setores</option>';
    setoresPresentes.forEach(s => {
        selectSetor.innerHTML += `<option value="${s}">${s}</option>`;
    });

    selectProjeto.innerHTML = '<option value="">Todos os Projetos</option>';
    projetosPresentes.forEach(p => {
        selectProjeto.innerHTML += `<option value="${p}">${p}</option>`;
    });
}

function aplicarFiltros() {
    const setorSel = document.getElementById('filtroSetor').value;
    const projSel = document.getElementById('filtroProjeto').value;
    const busca = document.getElementById('search').value.toLowerCase();

    let filtrados = dadosCruzadosCompletos.filter(item => {
        let matchSetor = !setorSel || item['Setor/Local'] === setorSel;
        let matchProj = !projSel || item['Projeto'] === projSel;
        
        let textoLinha = Object.values(item).join(" ").toLowerCase();
        let matchBusca = !busca || textoLinha.includes(busca);

        return matchSetor && matchProj && matchBusca;
    });

    montarDashboard(filtrados);
}

function montarDashboard(dadosFiltrados) {
    document.getElementById('total').innerText = dadosFiltrados.length;

    let mapaSetores = {};
    let mapaProjetos = {};

    dadosFiltrados.forEach(r => {
        let s = r['Setor/Local'] || 'Sem Setor';
        let p = r['Projeto'] || 'Sem Projeto';
        mapaSetores[s] = (mapaSetores[s] || 0) + 1;
        mapaProjetos[p] = (mapaProjetos[p] || 0) + 1;
    });

    document.getElementById('setores').innerText = Object.keys(mapaSetores).length;
    document.getElementById('projetos').innerText = Object.keys(mapaProjetos).length;

    const labelsCompletos = Object.keys(mapaSetores);
    const labelsCodigoApenas = labelsCompletos.map(l => l.split(' / ')[0]);
    const valores = Object.values(mapaSetores);

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('grafico'), {
        type: 'bar',
        data: {
            labels: labelsCodigoApenas,
            datasets: [{
                label: 'Itens por Local',
                data: valores,
                backgroundColor: '#17324d',
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: true, position: 'top' },
                tooltip: {
                    callbacks: {
                        title: function(context) {
                            let idx = context[0].dataIndex;
                            return labelsCompletos[idx];
                        }
                    }
                }
            },
            scales: {
                x: {
                    ticks: {
                        maxRotation: 0,
                        minRotation: 0,
                        font: { size: 11 }
                    }
                },
                y: { beginAtZero: true }
            }
        }
    });

    if (!dadosFiltrados.length) {
        document.getElementById('tbl').innerHTML = "<tr><td style='padding:20px; text-align:center;'>Nenhum registro encontrado.</td></tr>";
        return;
    }

    const cols = Object.keys(dadosFiltrados[0]);
    let html = "<thead><tr>";
    cols.forEach(c => html += `<th>${c}</th>`);
    html += "</tr></thead><tbody>";

    dadosFiltrados.forEach(r => {
        html += "<tr>";
        cols.forEach(c => html += `<td>${r[c] ?? ""}</td>`);
        html += "</tr>";
    });

    html += "</tbody>";
    document.getElementById('tbl').innerHTML = html;
}

// Inicia automaticamente assim que a página é carregada
document.addEventListener('DOMContentLoaded', inicializarEBuscarDados);
</script>

</body>
</html>
