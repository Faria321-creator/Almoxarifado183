<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado - Acesso ao Sistema</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        .login-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area h1 { font-size: 1.8rem; color: #fff; }
        .logo-area p { color: #38bdf8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 6px; background-color: #0f172a; color: #fff; font-size: 1rem; outline: none; }
        .form-group input:focus { border-color: #38bdf8; }
        .btn-entrar { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-entrar:hover { background-color: #1557b0; }
        .erro-msg { color: #f87171; font-size: 0.85rem; margin-top: 15px; text-align: center; display: none; }
    </style>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <h1>Almoxarifado</h1>
            <p>Áudio e Vídeo</p>
        </div>

        <form id="formLogin">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu-email@exemplo.com" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-entrar">Entrar no Sistema</button>
            <div id="erroMsg" class="erro-msg">E-mail ou senha incorretos!</div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
